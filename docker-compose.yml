# Ambiente de PRODUÇÃO (VPS). Passo a passo completo em DEPLOY.md.
#
# Requer um arquivo .env na raiz (copie de .env.example).
#
#   docker compose up -d --build     # sobe/atualiza tudo
#   docker compose logs -f api       # logs da API
#   docker compose ps                # status (inclui healthcheck)

# Nome fixo: os volumes ficam "bolao-tga_*", reaproveitando o certificado
# que o Caddy já emitiu na VPS.
name: bolao-tga

# Limita o tamanho dos logs para não encher o disco da VPS
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bolao}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    # SEM "ports" de propósito: o banco só é acessível pela rede interna do compose.
    # (O Docker ignora o ufw para portas publicadas.)

  api:
    build: ./api
    image: bolao-tga-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-bolao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bolao}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # Vazio = cadastro público desativado
      SIGNUP_CODE: ${SIGNUP_CODE:-}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # Também sem "ports": só o Caddy fala com a API, pela rede interna

  caddy:
    # Imagem do Caddy com o build do front embutido (web/Dockerfile)
    build: ./web
    image: bolao-tga-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
